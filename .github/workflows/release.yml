name: Docker Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/notify
      # arm64 paused org-wide (DOKS has no arm64 droplets — see hanzo
      # LLM.md "arm64 paused 2026-04-27"). amd64-only is the canonical
      # build path; armv8 consumers build from source until DO ships
      # arm64 instances and `hanzo-build-linux-arm64` ARC is unpaused.
      platforms: linux/amd64
    secrets: inherit
