apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hanzo Notify — base manifests. Operators (hanzoai/cloud,
# liquidityio/operator) overlay env-specific patches (image tag,
# domain, KMS endpoint) on top of this base.

namespace: hanzo

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: notifyd
    newName: ghcr.io/hanzoai/notify
    newTag: v1.6.8
